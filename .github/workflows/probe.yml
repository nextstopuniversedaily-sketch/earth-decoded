name: Find reusable images
on:
  push:
    branches: [main]
    paths: ["probe/queries.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python tools/probe.py
      - run: |
          git config user.name "render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/results.md
          git commit -q -m "Image search results [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
