name: Render videos

on:
  push:
    branches: [main]
    paths: ["shorts/**", "longform/**", "pipeline/**", "tools/**", ".github/workflows/render.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Download free voice model (Kokoro)
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s models/kokoro-v1.0.int8.onnx ] || curl -sSL -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx
          [ -s models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin

      - name: Install Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Render new or changed Shorts (saving each one as it finishes)
        run: |
          git config user.name "render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p previews videos/long
          for f in $(python pipeline/render.py --all --list); do
            python pipeline/render.py "$f" 2>&1 | tee "previews/$(basename "$f" .json).log"
            stem=$(python -c "import json,sys;print('s%03d' % json.load(open(sys.argv[1]))['number'])" "$f")
            bash tools/publish.sh "Render $(basename "$f" .json)" videos/$stem.* previews/$stem.jpg previews/sthumb-$stem.jpg "previews/$(basename "$f" .json).log" || true
          done

      - name: Render new or changed long-form videos (16:9)
        run: |
          for f in $(python pipeline/render_long.py --all --list); do
            slug=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['slug'])" "$f")
            python pipeline/render_long.py "$f" 2>&1 | tee "previews/long-$slug.log"
            python pipeline/thumbnail.py "$f" 2>&1 | tee -a "previews/long-$slug.log" || true
            bash tools/publish.sh "Render long-form $slug" videos/long/$slug.* previews/long-$slug.jpg previews/long-$slug.log previews/thumb-$slug.jpg || true
          done

      - name: Update the download list (UPLOAD.md)
        run: |
          git rebase --abort 2>/dev/null || true
          git fetch -q origin main && git reset -q --hard origin/main
          python tools/index.py
          git add UPLOAD.md
          git commit -q -m "Update UPLOAD.md" || true
          git push -q origin HEAD:main || true
